# Once a month, a pull request with updates of the NuGet packages (Directory.Packages.props) and of the actions the
# workflows use. Security fixes come sooner, as GitHub finds them.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
