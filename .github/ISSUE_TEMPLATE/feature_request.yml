name: Idea
description: Something SoftCal could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would help, and in which situation.
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How you do it today
      description: Optional. Another app, a workaround, or not at all.
